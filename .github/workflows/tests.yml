name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what has to come from the system
        run: |
          sudo apt-get update
          # libvirt-python links against the libvirt on the machine, so it comes
          # from apt rather than pip. The rest are shared libraries PySide6 wants
          # even when it renders offscreen.
          sudo apt-get install -y --no-install-recommends \
            python3-libvirt \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6

      - name: Install VMManager
        run: |
          # --system-site-packages so the virtualenv can see python3-libvirt
          python -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - name: Check libvirt-python is visible
        run: .venv/bin/python -c "import libvirt; print(libvirt.__file__)"

      - name: Run the tests
        # No display and no libvirt daemon: the suite runs against libvirt's
        # in-process test driver, and conftest asks Qt for the offscreen
        # platform. Verified locally by refusing every non-test: connection.
        run: .venv/bin/python -m pytest -q
