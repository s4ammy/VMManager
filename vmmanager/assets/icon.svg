<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VMManager">
  <title>VMManager</title>
  <!-- The app's own metaphor: machines as rack bays, each with a status LED
       on its left edge, one of them running. The colours are the theme's -
       accent #babaff, ok #8fdcb0, inset #0a0a0a - and the corner is shallow
       on purpose: this is a tool for machines.

       The plate is inset from the canvas rather than filling it, so the icon
       sits at the same visual size as everything else in a launcher, and the
       bays are spaced to stay three separate bars at 16px. -->
  <rect x="8" y="8" width="48" height="48" rx="4" fill="#babaff"/>
  <g fill="#0a0a0a">
    <rect x="13" y="15.5" width="38" height="9" rx="2"/>
    <rect x="13" y="27.5" width="38" height="9" rx="2"/>
    <rect x="13" y="39.5" width="38" height="9" rx="2"/>
  </g>
  <g>
    <rect x="16" y="18" width="3.5" height="4" rx="1.75" fill="#8fdcb0"/>
    <rect x="16" y="30" width="3.5" height="4" rx="1.75" fill="#babaff"/>
    <rect x="16" y="42" width="3.5" height="4" rx="1.75" fill="#babaff"/>
  </g>
</svg>
